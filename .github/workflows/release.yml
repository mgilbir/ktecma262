name: Release

# Publishes the artifacts for a version tag. The tag is the trigger, so the
# released bits are always exactly what was tagged.
#
# Three jobs rather than one, because the work has three different homes:
#
#   verify   Linux. The full test suite and the differential fuzz — long, and
#            there is no reason to pay macOS rates for it.
#   publish  macOS. The only host that can compile every target: Apple targets
#            need Xcode, and Kotlin/Native cross-compiles the Linux target from
#            macOS, so one host produces the complete set of variants. Building
#            on Linux is what shipped 0.1.2 with no native variants at all.
#   release  Linux. Creates the GitHub release page from the changelog.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches the project version
        # Guards against tagging v0.2.0 while the build still says 0.1.0, which
        # would publish artifacts that disagree with their own tag.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "Manual run; skipping tag/version comparison."
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${version}."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches project version ${version}."

      - name: Check the changelog has a section for this version
        # Fails here rather than after publishing, when the release notes are
        # the only thing left and the artifacts are already immutable.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          ./.github/scripts/changelog-section.sh "$version" > /dev/null
          echo "CHANGELOG.md has a section for $version."

      - name: Build and test
        # A release is never published from a red build.
        run: ./gradlew build --stacktrace

      - name: Check node's Unicode version matches the tables
        run: ./.github/scripts/check-node-unicode.sh

      - name: Fuzz against node
        run: ./gradlew fuzz -Pcount=200000 -Pseed=${{ github.run_number }}

  publish:
    name: Build and publish (macOS)
    needs: verify
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test every target
        run: ./gradlew build --stacktrace

      - name: Check every declared target is in the module metadata
        # The check that would have caught 0.1.2: a host that cannot build a
        # target silently drops its variant, and the artifact publishes anyway.
        run: ./gradlew verifyPublishedVariants

      - name: Publish to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${CENTRAL_TOKEN_USERNAME:-}" ] || [ -z "${MAVEN_GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::Maven Central credentials or signing key not configured;"
            echo "::notice::skipping publish. See the Releasing section of README.md."
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)

          # One bundle containing every publication, checked before it leaves
          # the runner. 0.1.3 uploaded each publication separately and the
          # server assembled four modules out of seven.
          ./gradlew centralBundle verifyCentralBundle --no-configuration-cache
          bundle="build/distributions/ktecma262-$version-bundle.zip"
          expected=$(ls build/central-bundle/io/github/mgilbir)
          echo "Modules in the bundle:"
          echo "$expected" | sed 's/^/  /'

          # Bearer credential is base64("user:pass"). Masked immediately and
          # passed to curl on stdin, so it never appears in a process argument.
          auth=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          hdr() { printf 'header = "Authorization: Bearer %s"\n' "$auth"; }

          # publishingType=USER_MANAGED: the Portal validates the deployment and
          # waits. Releasing to Central is irreversible, so it stays a decision.
          id=$(hdr | curl -sS -K - --fail-with-body -X POST \
            --form "bundle=@$bundle" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=ktecma262%20$version&publishingType=USER_MANAGED")
          echo "Deployment $id"

          # Wait for validation, then check the Portal registered every module.
          # This is what was missing: the upload succeeding says nothing about
          # what the deployment ended up containing.
          for _ in $(seq 1 60); do
            hdr | curl -sS -K - -X POST \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id" > status.json
            state=$(python3 -c "import json;print(json.load(open('status.json'))['deploymentState'])")
            echo "  state: $state"
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED) break ;;
              FAILED)
                echo "::error::Deployment $id failed validation."
                cat status.json
                exit 1
                ;;
            esac
            sleep 10
          done

          .github/scripts/check-deployment.py status.json build/central-bundle/io/github/mgilbir
          rm -f status.json

          echo "Release it at https://central.sonatype.com/publishing/deployments"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # klibs as well as jars: the native targets do not produce jars, and
          # attaching only jars would make the release page look JVM-only.
          find build/libs \( -name '*.jar' -o -name '*.klib' \) -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ktecma262-artifacts
          path: artifacts/
          retention-days: 90

  release:
    name: GitHub release
    needs: publish
    # Only a tag names a version to release. A manual run publishes to Central
    # but has no tag to hang a release page on.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: ktecma262-artifacts
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Notes come from the changelog, so the release page and the file in
          # the repository cannot drift apart.
          ./.github/scripts/changelog-section.sh "$version" > notes.md
          echo "" >> notes.md
          echo "Available from Maven Central as \`io.github.mgilbir:ktecma262:$version\`." >> notes.md

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; updating notes and assets."
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --latest
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "ktecma262 $version" \
              --notes-file notes.md \
              --latest \
              artifacts/*
          fi
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
