name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Linux runs JVM, JS and the Linux native target, plus the check that the
    # emitted class files really are Java 17 bytecode.
    #
    # macOS is not a duplicate of it: the Apple targets can only be compiled
    # there, so without this job they would first be built on the day of a
    # release. It also carries the variant check, since macOS is the one host
    # that can build the complete set.
    #
    # Windows runs the JVM tests, which is what would catch a platform-dependent
    # difference in the engine itself.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test (Linux, JVM + JS + linuxX64)
            os: ubuntu-latest
            task: build
          - name: Build and test (macOS, all targets)
            os: macos-latest
            task: build
          - name: JVM tests (Windows)
            os: windows-latest
            task: jvmTest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ${{ matrix.task }}
        shell: bash
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Check every declared target is in the module metadata
        # macOS only: it is the one host that can build the complete set, so
        # anywhere else this is expected to fail. Running it on every push is
        # what turns "the release dropped a target" into a pull request failure.
        if: matrix.os == 'macos-latest'
        run: ./gradlew verifyPublishedVariants

      - name: Build and check the Central bundle
        # Assembles the real upload bundle with all seven publications and
        # checks it, without uploading anything. The publish path used to run
        # for the first time during a release, which is how 0.1.3 shipped with
        # three modules missing. Unsigned here — no key is available to CI, so
        # the signature check is skipped and the release job still covers it.
        if: matrix.os == 'macos-latest'
        run: ./gradlew centralBundle verifyCentralBundle

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  fuzz:
    # The recorded corpus in the build job replays results captured earlier;
    # this compares against a live JavaScript engine, which is what finds cases
    # nobody thought to record.
    name: Differential fuzz against node
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          # Must carry the same Unicode version as the compiled tables; the next
          # step fails loudly if it does not.
          node-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check node's Unicode version matches the tables
        run: ./.github/scripts/check-node-unicode.sh

      - name: Fuzz
        # The seed varies per run so successive builds explore different cases,
        # and it is printed so any failure can be reproduced exactly.
        run: ./gradlew fuzz -Pcount=100000 -Pseed=${{ github.run_number }}
