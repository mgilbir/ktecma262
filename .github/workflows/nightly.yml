name: Nightly

# Longer checks than a pull request should wait for, plus the ones that depend
# on upstream data and can therefore start failing without anything in this
# repository changing.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_count:
        description: Cases per seed
        default: "500000"

permissions:
  contents: read

jobs:
  deep-fuzz:
    name: Deep differential fuzz (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check node's Unicode version matches the tables
        run: ./.github/scripts/check-node-unicode.sh

      - name: Fuzz
        run: >
          ./gradlew fuzz
          -Pcount=${{ github.event.inputs.fuzz_count || '500000' }}
          -Pseed=${{ matrix.seed }}${{ github.run_number }}

  number-fuzz:
    # The number functions are covered by fixed fixtures during a build; this is
    # the only place they meet cases nobody chose. That matters most for the
    # parser, whose input space is text rather than a bounded set of doubles.
    name: Number fuzz against node (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fuzz
        run: >
          ./gradlew numberFuzz
          -Pcount=${{ github.event.inputs.fuzz_count || '500000' }}
          -Pseed=${{ matrix.seed }}${{ github.run_number }}

  uri-fuzz:
    # Encoding is verified exhaustively during a build; decoding cannot be,
    # because its input is text. Rejecting malformed escapes is the security
    # property, so this is where the ways to be malformed get explored.
    name: URI fuzz against node (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fuzz
        run: >
          ./gradlew uriFuzz
          -Pcount=${{ github.event.inputs.fuzz_count || '500000' }}
          -Pseed=${{ matrix.seed }}${{ github.run_number }}

  unicode-drift:
    # Regenerates the tables from upstream and fails if they differ from the
    # committed ones. A failure here usually means Unicode published new data
    # (the emoji sequence files track "latest"), not that anything is broken —
    # but it is exactly when the tables need regenerating and re-verifying.
    name: Unicode data drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Check node's Unicode version matches the tables
        run: ./.github/scripts/check-node-unicode.sh

      - name: Download the UCD
        run: ./tools/genunicode/fetch-ucd.sh "$RUNNER_TEMP/ucd" 17.0.0

      - name: Regenerate the tables
        run: >
          node tools/genunicode/gen.mjs "$RUNNER_TEMP/ucd"
          src/commonMain/kotlin/io/github/mgilbir/ecma262/unicode/UnicodeTables.kt

      - name: Fail if the committed tables are stale
        run: |
          if ! git diff --exit-code --stat -- \
              src/commonMain/kotlin/io/github/mgilbir/ecma262/unicode/UnicodeTables.kt; then
            echo "::error::Regenerating from upstream produced different tables."
            echo "Upstream Unicode data has changed. Regenerate and re-verify:"
            echo "  see the Unicode section of README.md"
            exit 1
          fi
          echo "Tables match a fresh generation from upstream."

      - name: Check the normalisation tables are current
        # Same spirit as the table check above: regenerate from the UCD and fail
        # if upstream moved. Normalisation data changes rarely, and when it does
        # the fixture has to be regenerated with it.
        run: |
          set -euo pipefail
          node tools/genunicode/gen-normalization.mjs "$RUNNER_TEMP/ucd" \
            src/commonMain/kotlin/io/github/mgilbir/ecma262/unicode/NormalizationTables.kt 17.0.0
          node tools/genunicode/gen-normalization-fixture.mjs "$RUNNER_TEMP/ucd" \
            src/commonTest/kotlin/io/github/mgilbir/ecma262/text/NormalizationFixture.kt 17.0.0
          if ! git diff --exit-code --stat -- \
              src/commonMain/kotlin/io/github/mgilbir/ecma262/unicode/NormalizationTables.kt \
              src/commonTest/kotlin/io/github/mgilbir/ecma262/text/NormalizationFixture.kt; then
            echo "::error::Regenerating normalisation data from upstream produced different files."
            exit 1
          fi
          echo "Normalisation tables and conformance fixture match upstream."

      - name: Check the Test262 number fixture is current
        # Regenerates from tc39/test262 and fails if upstream has changed. Like
        # the Unicode check above, a failure here is news rather than a defect.
        run: |
          set -euo pipefail
          node tools/test262/gen-number-fixture.mjs \
            src/commonTest/kotlin/io/github/mgilbir/ecma262/number/Test262NumberFixture.kt \
            "$RUNNER_TEMP/test262-cache"
          if ! git diff --exit-code --stat -- \
              src/commonTest/kotlin/io/github/mgilbir/ecma262/number/Test262NumberFixture.kt; then
            echo "::error::Test262's Number tests have changed upstream."
            echo "Regenerate the fixture and check the new cases still pass."
            exit 1
          fi
          echo "The Test262 number fixture matches upstream."

      - name: Verify every property against node
        # Independent of the diff above: this checks the tables against the
        # engine's own Unicode data, code point by code point.
        run: >
          node tools/genunicode/verify-against-node.mjs
          src/commonMain/kotlin/io/github/mgilbir/ecma262/unicode/UnicodeTables.kt
