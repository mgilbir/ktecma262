name: Nightly

# Longer checks than a pull request should wait for, plus the ones that depend
# on upstream data and can therefore start failing without anything in this
# repository changing.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_count:
        description: Cases per seed
        default: "500000"

permissions:
  contents: read

jobs:
  deep-fuzz:
    name: Deep differential fuzz (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check node's Unicode version matches the tables
        run: ./.github/scripts/check-node-unicode.sh

      - name: Fuzz
        run: >
          ./gradlew fuzz
          -Pcount=${{ github.event.inputs.fuzz_count || '500000' }}
          -Pseed=${{ matrix.seed }}${{ github.run_number }}

  number-fuzz:
    # The number functions are covered by fixed fixtures during a build; this is
    # the only place they meet cases nobody chose. That matters most for the
    # parser, whose input space is text rather than a bounded set of doubles.
    name: Number fuzz against node (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fuzz
        run: >
          ./gradlew numberFuzz
          -Pcount=${{ github.event.inputs.fuzz_count || '500000' }}
          -Pseed=${{ matrix.seed }}${{ github.run_number }}

  uri-fuzz:
    # Encoding is verified exhaustively during a build; decoding cannot be,
    # because its input is text. Rejecting malformed escapes is the security
    # property, so this is where the ways to be malformed get explored.
    name: URI fuzz against node (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fuzz
        run: >
          ./gradlew uriFuzz
          -Pcount=${{ github.event.inputs.fuzz_count || '500000' }}
          -Pseed=${{ matrix.seed }}${{ github.run_number }}

  date-fuzz:
    # The Date Time String Format is a parser, so its input space is text and a
    # fixed corpus can only ever sample it. Node is the oracle for strings the
    # grammar admits; outside it, node is free to use its own parser and does,
    # so there the requirement is only that the library returns NaN.
    name: Date fuzz against node (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fuzz
        run: >
          ./gradlew dateFuzz
          -Pcount=${{ github.event.inputs.fuzz_count || '500000' }}
          -Pseed=${{ matrix.seed }}${{ github.run_number }}

  unicode-drift:
    # Regenerates the tables from upstream and fails if they differ from the
    # committed ones. A failure here usually means Unicode published new data
    # (the emoji sequence files track "latest"), not that anything is broken —
    # but it is exactly when the tables need regenerating and re-verifying.
    name: Unicode data drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Check node's Unicode version matches the tables
        run: ./.github/scripts/check-node-unicode.sh

      - name: Download the UCD
        run: ./tools/genunicode/fetch-ucd.sh "$RUNNER_TEMP/ucd" 17.0.0

      - name: Regenerate the tables
        run: >
          node tools/genunicode/gen.mjs "$RUNNER_TEMP/ucd"
          src/commonMain/kotlin/io/github/mgilbir/ecma262/unicode/UnicodeTables.kt

      - name: Fail if the committed tables are stale
        # The UCD is pinned, but the two emoji sequence files are not: they come
        # from /Public/emoji/latest, which Unicode moves ahead of the engines.
        # On 2026-09-17 it became Emoji 18.0 while node was still on Unicode
        # 17.0, and regenerating would have added nineteen sequences that no
        # shipping engine matches - breaking agreement with the very oracle the
        # tables are verified against. So when the emoji version has run ahead,
        # the emoji-derived properties are reported rather than compared, and
        # everything the pinned UCD produces is still checked exactly.
        #
        # The trigger to move is node, not the calendar: when it ships a new
        # Unicode version, check-node-unicode.sh fails and everything is bumped
        # together.
        run: |
          set -euo pipefail
          expected_emoji=17.0
          got_emoji=$(cat "$RUNNER_TEMP/ucd/EMOJI_VERSION")
          ignore=""
          if [ "$got_emoji" != "$expected_emoji" ]; then
            echo "::notice::Emoji latest is $got_emoji; these tables target $expected_emoji to match node's Unicode version."
            echo "Not comparing the emoji-derived properties of strings: upstream is ahead of every engine."
            echo "They will be compared again once node ships the matching Unicode version."
            ignore='^[[:space:]]*"(Basic_Emoji|Emoji_Keycap_Sequence|RGI_Emoji|RGI_Emoji_Flag_Sequence|RGI_Emoji_Modifier_Sequence|RGI_Emoji_Tag_Sequence|RGI_Emoji_ZWJ_Sequence)" to "'
          fi
          if ! ./.github/scripts/check-regenerated.sh ${ignore:+--ignore "$ignore"} \
              src/commonMain/kotlin/io/github/mgilbir/ecma262/unicode/UnicodeTables.kt; then
            echo "Upstream Unicode data has changed. Regenerate and re-verify:"
            echo "  see the Unicode section of README.md"
            exit 1
          fi

      - name: Check the normalisation tables are current
        # Same spirit as the table check above: regenerate from the UCD and fail
        # if upstream moved. Normalisation data changes rarely, and when it does
        # the fixture has to be regenerated with it.
        #
        # The comparison ignores the line recording which engine generated the
        # file. That line moves with every node patch release and says nothing
        # about the data, which is how this check failed on its first run.
        run: |
          set -euo pipefail
          node tools/genunicode/gen-normalization.mjs "$RUNNER_TEMP/ucd" \
            src/commonMain/kotlin/io/github/mgilbir/ecma262/unicode/NormalizationTables.kt 17.0.0
          node tools/genunicode/gen-normalization-fixture.mjs "$RUNNER_TEMP/ucd" \
            src/commonTest/kotlin/io/github/mgilbir/ecma262/text/NormalizationFixture.kt 17.0.0
          ./.github/scripts/check-regenerated.sh \
            src/commonMain/kotlin/io/github/mgilbir/ecma262/unicode/NormalizationTables.kt \
            src/commonTest/kotlin/io/github/mgilbir/ecma262/text/NormalizationFixture.kt

      - name: Check the Test262 number fixture is current
        # Regenerates from tc39/test262 and fails if upstream has changed. Like
        # the Unicode check above, a failure here is news rather than a defect.
        #
        # The token is not for access - tc39/test262 is public - but for the
        # rate limit. Unauthenticated api.github.com allows 60 requests an hour
        # per source address, and Actions runners share addresses, so this step
        # can be refused for traffic that is not ours. It was, on 2026-09-08,
        # on its first call.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node tools/test262/gen-number-fixture.mjs \
            src/commonTest/kotlin/io/github/mgilbir/ecma262/number/Test262NumberFixture.kt \
            "$RUNNER_TEMP/test262-cache"
          if ! ./.github/scripts/check-regenerated.sh \
              src/commonTest/kotlin/io/github/mgilbir/ecma262/number/Test262NumberFixture.kt; then
            echo "Test262's Number tests have changed upstream."
            echo "Regenerate the fixture and check the new cases still pass."
            exit 1
          fi

      - name: Verify every property against node
        # Independent of the diff above: this checks the tables against the
        # engine's own Unicode data, code point by code point.
        run: >
          node tools/genunicode/verify-against-node.mjs
          src/commonMain/kotlin/io/github/mgilbir/ecma262/unicode/UnicodeTables.kt
